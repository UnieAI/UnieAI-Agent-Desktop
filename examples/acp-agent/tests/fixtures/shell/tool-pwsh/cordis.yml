# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@unieai/uad-system-prompt'

- id: tools
  name: '@unieai/uad-tools'

- id: subprocess
  name: '@unieai/uad-subprocess-local'

- id: bash
  name: '@unieai/uad-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@unieai/uad-shell-env'

- id: tasks
  name: '@unieai/uad-jobs-local'

- id: tool-jobs
  name: '@unieai/uad-tool-jobs'

- id: tool-pwsh
  name: '@unieai/uad-tool-pwsh'
