# The dsh-web-app bundle patch: the browser surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `rabi --profile web --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# TODO: Re-enable shared HMR for Web after its reload lifecycle is tested.
- id: hmr
  disabled: true

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|code|both) opts a whole dsh
    # process into Code Mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: code-runtime
      name: '@unieai/uad-code-runtime-worker-thread'

    - id: storage
      name: '@unieai/uad-storage'

    - id: storage-json
      name: '@unieai/uad-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@unieai/uad-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@unieai/uad-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@unieai/uad-session-log-export'

    - id: workspace
      name: '@unieai/uad-workspace'

    # The terminal a PERSON drives, over the same subprocess primitive the
    # agent's PTY tools use — but its own registry, with no Agent behind it.
    # Web-only on purpose: it exists for the GUI panel, and the headless and
    # ACP profiles have no one sitting in front of them to type into it.
    - id: operator-terminal
      name: '@unieai/uad-terminal-operator'

    # The browser a PERSON drives: a real Chrome the Host launches, seen
    # through a CDP screencast. Web-only for the terminal's reason, and its own
    # Chrome rather than the reader's running one — attaching to a browser
    # someone is already using would move their tabs and their windows around
    # underneath them.
    - id: operator-browser
      name: '@unieai/uad-browser-operator'

    # `image_inspect`: the turn keeps its own model and hands ONE question about
    # ONE picture to a vision route. Dormant until a route is named here, so a
    # deployment with no vision model offers no such tool rather than one that
    # fails every call. Name it as:
    #   config: { provider: '<llm route>', model: '<model id declaring image input>' }
    - id: tool-image-inspect
      name: '@unieai/uad-tool-image-inspect'

    - id: session-projection-cache
      name: '@unieai/uad-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-reference
      name: '@unieai/uad-session-reference'

    - id: file-reference-local
      name: '@unieai/uad-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@unieai/uad-session-stats'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@unieai/uad-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@unieai/uad-host-plugin-inventory'

    # The API gateway: the transport-agnostic dispatch face every client shape
    # shares. The base layer's agent-default-model service owns the default model.
    - id: api-gateway
      name: '@unieai/uad-host-apiproxy'

    - id: cordis-host-runner
      name: '@unieai/uad-cordis-host-runner'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@unieai/uad-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served by
    # the web-runtime row below through the fallback seat.
    - id: webserver
      name: '@unieai/uad-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of dsh-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles. The webStartup provider
    # supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the host-owned
    # shell variable.
    - id: web-runtime
      name: '@unieai/uad-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@unieai/uad-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@unieai/uad-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client.
    - id: connection
      name: '@unieai/uad-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@unieai/uad-api-remotes'

    - id: client-runtime
      name: '@unieai/uad-client-runtime'

    - id: cordis-client-runner
      name: '@unieai/uad-cordis-client-runner'

    - id: ui-theme
      name: '@unieai/uad-client-ui-theme'

    - id: locale
      name: '@unieai/uad-client-locale'

    - id: ui-layout
      name: '@unieai/uad-client-ui-layout'

    - id: ui-renderer
      name: '@unieai/uad-client-ui-renderer'

    - id: ui-sidebar
      name: '@unieai/uad-client-ui-sidebar'

    - id: ui-settings
      name: '@unieai/uad-client-ui-settings'

    - id: ui-settings-general
      name: '@unieai/uad-client-ui-settings-general'

    - id: ui-settings-models
      name: '@unieai/uad-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@unieai/uad-client-ui-settings-plugin-inventory'

    # Notifications: the desktop-notification permission for this device plus
    # the cue played when a turn finishes while nobody is watching it.
    - id: ui-settings-notifications
      name: '@unieai/uad-client-ui-settings-notifications'

    # Connections: the outside accounts this app has been let into, and the
    # two buttons that grant or withdraw one. Reads the connector book above
    # over the host API; a build without that row lists nothing rather than
    # showing a broken page.
    - id: ui-settings-connectors
      name: '@unieai/uad-client-ui-settings-connectors'

    # Startup initialization: reads the sign-in gate's /auth/bootstrap answer
    # once — account, providers, models, MCP servers, all gathered host-side —
    # and provides it as `unieaiBootstrap`. It MUST stay ahead of every row
    # that reads that service, because each reads it while its own body runs;
    # and the browser does not mount until this row's read has settled, which
    # is what keeps the interface from opening half-populated.
    - id: unieai-bootstrap
      name: '@unieai/uad-client-unieai-bootstrap'

    # The account seam's supplier: fills the `unieaiAccount` service from the
    # startup answer above, falling back to its own /auth/account read when no
    # startup answer is available. It MUST stay ahead of the ui-unieai-account
    # row — that section reads the service once while its own body runs, so a
    # supplier activating later never reaches it.
    - id: unieai-account-gateway
      name: '@unieai/uad-client-unieai-account-gateway'

    # UnieAI account page: profile, plan, remaining usage, and the invite link.
    # Without an account gateway it renders its not-connected state.
    - id: ui-unieai-account
      name: '@unieai/uad-client-ui-unieai-account'

    # The UnieAI account's API Providers, read from — and added back to — the
    # web product through the sign-in gate's /auth/providers route. It renders
    # INSIDE the Models page (the `settings.models.account` slot), above that
    # page's own rows: a row here keeps its key on the product's server and is
    # metered by the account, a row there keeps its key on this machine and is
    # metered by nobody, and one page is what names that difference. The row
    # renders its signed-out line without a gate, so it is safe in a
    # composition that mounts no gate at all; drop `ui-settings-models` and the
    # list simply has no page to render into.
    - id: ui-unieai-providers
      name: '@unieai/uad-client-ui-unieai-providers'

    # The mascot. Its node half owns the `ui-pet` settings section the picker
    # writes; the sprite sheets are static web assets (apps/web/public/pets),
    # because a 1.7 MB grid imported by the browser half would sit base64
    # inside `client.js` and be paid for on every load, mascot or no mascot.
    - id: ui-pet
      name: '@unieai/uad-client-ui-pet'

    - id: ui-conversation
      name: '@unieai/uad-client-ui-conversation'

    # Which machine the work runs on, in the composer's tool row. Its node
    # half registers nothing: the machine list is the host's own service.
    # Four steps the first time somebody opens this, and never again. Its node
    # half registers nothing: the tour is drawn in the browser and the one
    # thing it remembers is a durable setting.
    - id: ui-first-run
      name: '@unieai/uad-client-ui-first-run'

    - id: ui-machines
      name: '@unieai/uad-client-ui-machines'

    # What that machine is doing, beside the view switch in the session
    # header. Its node half registers nothing either: the reading is taken by
    # the host's sampler, on whichever machine the router is pointed at.
    - id: ui-machine-gauges
      name: '@unieai/uad-client-ui-machine-gauges'

    # Where work happens. The machine list is `local` plus the aliases in the
    # person's own OpenSSH configuration; the routed providers put the whole
    # execution world on whichever one they pick. This computer keeps the
    # sandbox fence it already had — the router builds the sandboxed local
    # filesystem when a policy is mounted.
    - id: ssh
      name: '@unieai/uad-ssh'
      config:
        # The person's own OpenSSH configuration by default; an explicit path
        # is for a deployment that keeps one elsewhere, and for tests that
        # must not read a developer's real machines.
        configPath: !!js process.env.DSH_SSH_CONFIG

    - id: machines
      name: '@unieai/uad-machines'

    # The connector book: the outside services this app can be let into. It
    # files every grant through `credentials`, which the base layer mounts.
    #
    # `clientIds` is a deployment fact, not a constant: a client id names the
    # application on the provider's consent screen, and this fork is not the
    # same application as anybody else's build. A provider with no id here is
    # still listed, and says what is missing instead of failing at the
    # provider; the connectors that register themselves need none at all.
    - id: connectors
      name: '@unieai/uad-connector'
      config:
        clientIds:
          google: !!js process.env.RABI_CONNECTOR_GOOGLE_CLIENT_ID
          microsoft: !!js process.env.RABI_CONNECTOR_MICROSOFT_CLIENT_ID

    - id: fs-routed
      name: '@unieai/uad-execution-router/fs'

    - id: subprocess-routed
      name: '@unieai/uad-execution-router/subprocess'

    # Reads the machine through the routed subprocess seam above, so it is
    # mounted after it: a sampler that started first would measure whichever
    # world happened to be current at boot.
    - id: machine-metrics
      name: '@unieai/uad-machine-metrics'

    # Citations under a Studio knowledge-base result, in the details panel's
    # per-call annotation list. Mounted after the panel that declares the
    # hole; the registration waits for it either way.
    - id: ui-studio-sources
      name: '@unieai/uad-client-ui-studio-sources'

    # UnieAI occupants for the generic sidebar and conversation brand slots.
    # The upstream official-brand row is deliberately absent: its occupants
    # would contend for the same single-kind cells.
    # Browser sign-in gate. `enforce: false` ships the /auth routes and the
    # sign-in page without refusing any traffic, so the flow can be exercised
    # before the fence is committed to; flipping it on is what actually closes
    # the machine. See the package README.
    - id: unieai-web-gate
      name: '@unieai/uad-unieai-web-gate'
      config:
        productUrl: 'https://agent.unieai.com'
        enforce: true
        # No allowlist here, so the first account to sign in claims this
        # machine and keeps it until it signs out. A pinned id used to sit
        # here, which made the shipped package admit exactly ONE account —
        # every other customer installed it and could not sign in at all, and
        # no restart or upgrade helped, because an allowlist is configuration
        # rather than the in-memory claim.
        #
        # The objection that first-login-wins is "a race, not an access
        # decision" is true of a machine OTHERS CAN REACH, and false of this
        # one: the package serves 127.0.0.1, so the only person who can race
        # for the claim is the person at the keyboard. A shared deployment is
        # the case that needs the fence, and it states its own accounts in its
        # own patch layer — which is where a deployment fact belongs, rather
        # than compiled into the package everyone installs.
        allowedUserIds: []
        claimFirstLogin: true

    # The account's MCP servers, mounted from the gate above. The product mints
    # a bearer per server that is good for about an hour, so this row re-reads
    # the list and re-mounts ahead of each expiry; a mounted server whose bearer
    # lapsed fails every call with no other signal. Without a gate session it
    # mounts nothing, which is the signed-out posture.
    - id: unieai-mcp-supervisor
      name: '@unieai/uad-unieai-mcp-supervisor'

    # The account's entitled models, as a runnable route through the product's
    # metered inference relay. The route hides itself whenever the gate holds no
    # session (`credentialReady: false`), so a signed-out desktop offers no
    # cloud models rather than names that fail when chosen.
    - id: llm-unieai-cloud
      name: '@unieai/uad-llm-unieai-cloud'

    - id: ui-brand-unieai
      name: '@unieai/uad-client-ui-brand-unieai'

    - id: ui-attachment
      name: '@unieai/uad-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@unieai/uad-client-ui-tool'

    - id: ui-cordis
      name: '@unieai/uad-client-ui-cordis'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@unieai/uad-client-ui-workflow-run'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@unieai/uad-client-ui-deliverables'


    - id: ui-workspace
      name: '@unieai/uad-client-ui-workspace'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@unieai/uad-client-ui-input-trigger'

    - id: ui-commands
      name: '@unieai/uad-client-ui-commands'

    - id: ui-skill
      name: '@unieai/uad-client-ui-skill'

    - id: ui-subagent
      name: '@unieai/uad-client-ui-subagent'

    - id: ui-reference
      name: '@unieai/uad-client-ui-reference'

    # Background jobs: the session-header list over the jobsBySession mirror.
    - id: ui-jobs
      name: '@unieai/uad-client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@unieai/uad-client-ui-goal'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@unieai/uad-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@unieai/uad-client-ui-model-selection'

    - id: ui-permission
      name: '@unieai/uad-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@unieai/uad-client-ui-agent-preset'

    # The Plugins page: the sidebar's Plugins row opens it, and it declares the
    # `plugins.page.area` hole the two rows below and beside it fill. Removing
    # this row removes the page AND the nav row, and the cordis area below has
    # nowhere left to render — the settings shell's own Plugins row then comes
    # back only if that area is registered as a settings section again.
    - id: ui-plugins-page
      name: '@unieai/uad-client-ui-plugins-page'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards, as one area on the Plugins page. A namespace this deployment does
    # not expose renders nothing.
    - id: ui-settings-plugins
      name: '@unieai/uad-client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@unieai/uad-client-ui-plan'

    - id: ui-user-questions
      name: '@unieai/uad-client-ui-user-questions'

    - id: ui-trajectory
      name: '@unieai/uad-client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# Web surface disables them here and lets each session mount a preset instead.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

# `shell-env` STAYS in the host plane: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# would never reach the model's shell at all.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. Its producers — `tool-bash` here, `tool-terminal` and a
# non-continuable `tool-subagent` elsewhere — are preset rows that resolve it
# with `ctx.get`, and an entry-local realm around the registry is invisible to
# every sibling row outside that realm, so `run_in_background` answered
# "background jobs unavailable" while the controls sat in the catalog. That is
# the `goals` criterion read from inside the preset: a Service a row outside its
# realm READS belongs to the plane both can see. The registry is keyed by owning
# agent, so one host instance serves every session exactly as before presets.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# The `skill` REGISTRY stays in the host plane. It is host+per-scope layered
# (the tools-registry shape): deployment-level providers — repository plugins,
# a host skill-filesystem row — register into its global layer, while a preset's
# `skill-filesystem` registers into that preset's layer, and each agent reads the
# merged catalog its scope chain selects. Only the per-agent rows move behind
# presets: the base host `skill-filesystem` row is disabled here (presets own local
# discovery), and `tool-skill` is what a preset mounts to give its agent the
# catalog and loader at all.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal SERVICE, its session driver, and the `/goal` command STAY on the
# host plane; only the model-facing tool moves. The Gateway serves the goal
# domain as Remote endpoints, and a Remote method picks its receiver Service
# from a generated descriptor — it resolves `goals` on the host, so a
# per-session realm would answer `service-unavailable` for every browser call.
# That is the `shell-env` criterion read from the other side: injection is not
# the only host relationship a Service can have. The registry is keyed by
# session, so one host instance serves every session exactly as before presets.

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. It owns the context-meter projection units, and that table is
# process-wide, so preset ownership would make the meter a function of which
# presets happen to be mounted rather than a per-session fact. Same criterion as
# `tasks` and `goals`; the reasoning has one home in
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. `subagents` is
# a process singleton with a cross-session query surface (`listChildren`,
# `followup`) that the host api-proxy serves to the browser, and a provider
# registers under a globally unique name, so a per-session copy would both
# starve that host row and collide on the second session. What a preset
# chooses is which delegation TOOLS its agent sees, below.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

# `tool-subagent-report` is host-plane for the same reason as the registry, not
# because a preset may not want it: it registers a CONTINUABLE SETUP on that
# singleton rather than a tool this agent calls, and the setup list is not
# scope-aware — one copy per mounted preset means every child gets `report`
# registered once per live session, which throws on the second.

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. `config/agent-presets/` ships with the deployment and is
# read-only (its entries carry `system` trust); `$DSH_HOME/.agent-presets` is
# where a person — or an agent — authors their own, and carries the same trust
# as shell access because a preset IS a composition.
#
# Only the SHIPPED root is an assembly fact: it sits beside the installed app's
# own config, so `apps/cli`'s `composeProfile` resolves and patches it in — the
# same treatment `distIndex` gets on the webserver row. The writable root is
# `dsh-agent-presets`' own default (`includeUserRoot`), so a composition that
# never reaches that patch still finds a person's presets.
- insert:
    - id: agent-presets
      name: '@unieai/uad-agent-presets'
      config:
        default: standard

# GenUI: the model may answer with a ```dsh-ui fence, and this renders it —
# layout, charts, forms, mermaid, 3D — with an action loop back to the model.
#
# A COMMUNITY plugin, and the first one this product ships. It is published
# against the upstream harness names (`@deepseek-ai/dsh-*`), which this fork
# renamed; it works here because `dsh-upstream-names` already answers an
# upstream request on both sides — the host publishes each package under its
# legacy name too, and the browser's module table resolves one to the product
# package. Shipping it is therefore also the standing proof that a plugin
# written for the upstream ecosystem runs unmodified on this fork.

# The execution world is routed now: these two rows are what it routes to,
# built privately per machine rather than mounted once here.
- id: subprocess
  disabled: true

- id: fs-sandbox
  disabled: true
