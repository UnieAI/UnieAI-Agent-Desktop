# Packaging for the desktop shell.
#
# `files` ships the shell's own compiled `lib/` and nothing else from this
# workspace; `asarUnpack` keeps the harness and its native dependencies outside
# the archive, because a native module cannot be loaded from inside an asar and
# the harness spawns processes that need real paths on disk.
appId: com.unieai.rabi
productName: Rabi
copyright: UnieAI

directories:
  output: release
  buildResources: build

files:
  - lib/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# The harness runs as a real Node program: it opens files, spawns shells and
# loads a platform-specific sandbox. None of that works from inside an asar.
#
# THE WHOLE TREE, not a list of the packages that obviously need it. Two
# release-blocking failures came from splitting node_modules across the
# archive boundary:
#
#   1. `$DSH_HOME/profiles/node_modules` links each plugin package to where
#      resolution found it. Electron's patched `fs` READS through `app.asar`,
#      so the search succeeds there — but Node's resolver calls `realpath` on
#      a symlink target, and realpath through the archive file fails with
#      ENOTDIR. Every client package resolved to nothing, the boot graph
#      served `entries: []`, and the page died on "HTML did not preload
#      @unieai/uad-client-modules/client.js".
#   2. Pointing those links at the unpacked twins instead moved the problem
#      one level down: `@unieai/uad-goal/lib/typert.host.js` sits outside the
#      archive while `zod` sits inside it, and a module cannot reach across
#      that line — `Cannot find package 'zod'`, six contributors at once.
#
# A shared library also cannot be dlopen'd from inside an asar at all: sharp's
# binding loads `libvips-cpp.so` by path, which is what produced
# `ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.3` from an archived tree.
#
# What the archive still holds is the shell's own `lib/`, which is what `files`
# ships and what nothing resolves through.
asarUnpack:
  - node_modules/**

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Unsigned for now. `identity: null` makes that explicit rather than letting
  # electron-builder pick up whatever certificate happens to be in a keychain,
  # which would produce a build signed by an identity nobody chose.
  # See src/updates.ts for what changes when a Developer ID exists.
  identity: null

win:
  # No `arch` list, for the reason mac has none: the arch comes from the CLI
  # flag each `package:win:*`/`publish:win:*` script passes, and the release
  # workflow gives each
  # one its OWN runner. Listing both here made every Windows runner rebuild the
  # native modules for both — and an arm64 runner cannot build x64 ones, so the
  # arm64 job packaged `Rabi.exe`, then died in node-pty's x64 rebuild with
  # `MSB8040: Spectre-mitigated libraries are required`. The four targets are
  # four machines; the config should not ask one of them for two.
  target:
    - nsis

# Linux is the one platform that does NOT take its executable name from
# `productName`: macOS builds `Rabi.app` and Windows builds `Rabi.exe` from it,
# while electron-builder's Linux packager falls back to the sanitized PACKAGE
# name — which for a scoped package comes out as `@unieaiuad-desktop`. Saying it
# here is what makes the binary `rabi` on all three.
linux:
  executableName: rabi
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

publish:
  provider: github
  owner: UnieAI
  repo: UnieAI-Agent-Desktop
